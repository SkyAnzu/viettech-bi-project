name: VietTech BI Warehouse CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-warehouse:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static quality & coverage dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy coverage

      - name: Static analysis gates (Ruff lint & Mypy type check)
        run: |
          ruff check src scripts tests
          mypy src/viettech

      - name: Syntax check Python modules & scripts
        run: |
          python -m compileall -q src scripts tests data/raw/generate_data.py

      - name: Pre-ingestion Data Contract & Lineage validation
        run: |
          python scripts/contract_validator.py --raw-dir data/raw --contract config/data_contracts.json --emit-lineage benchmarks/lineage_manifest.json

      - name: BigQuery SQL dry-run render check (full & incremental)
        run: |
          python scripts/run_sql_pipeline.py --dry-run
          python scripts/run_sql_pipeline.py --dry-run --mode incremental --watermark "2024-12-02 00:00:00"
          python scripts/etl_csv_to_bq.py --dry-run

      - name: Run local SQLite warehouse (full + benchmark) & Prescriptive Data Mining
        run: |
          python scripts/run_local_warehouse.py --mode full --benchmark
          python scripts/analytics_mining.py

      - name: Run automated tests with White-Box branch coverage gate (>= 75%)
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=75
